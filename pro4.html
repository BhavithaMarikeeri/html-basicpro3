
<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>

    <style>
        body {
            background:skyblue;
            font-family: Arial;
        }

        .heading {
            position: relative;
            text-align: center;
        }

        h1 {
            color: darkblue;
            font-size: 30px;
        }

        .details {
            position: absolute;
            left: 20px;
            top: 10px;
            color: darkred;
            font-size: 16px;
            font-weight: bold;
            text-align: left;
        }

        table {
            margin: auto;
            background: white;
            padding: 20px;
        }

        td {
            padding: 8px;
            color: darkgreen;
            font-size: 16px;
        }

        input, select, textarea {
            background: lightyellow;
            padding: 5px;
        }
    </style>
</head>

<body>

    <div class="heading">
        <div class="details">
            Name:Marikeeri Bhavitha<br>
            USN: 1BI24CS120
        </div>

        <h1>Registration Form</h1>
    </div>

    <form>
        <table>
            <tr><td>Name:</td><td><input type="text"></td></tr>
            <tr><td>Email:</td><td><input type="email"></td></tr>
            <tr><td>Password:</td><td><input type="password"></td></tr>

            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="g"> Male
                    <input type="radio" name="g"> Female
                </td>
            </tr>

            <tr>
                <td>Course:</td>
                <td>
                    <select>
                        <option>BCA</option>
                        <option>B.Tech</option>
                        <option>MCA</option>
                    </select>
                </td>
            </tr>

            <tr>
                <td>Skills:</td>
                <td>
                    <input type="checkbox"> HTML
                    <input type="checkbox"> CSS
                </td>
            </tr>

            <tr><td>Address:</td><td><textarea></textarea></td></tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Register">
                    <input type="reset" value="Clear">
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
